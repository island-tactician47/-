<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#26221e">
<title>町 - 工場地帯シミュ</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  #townwrap { position: relative; margin: 0 -12px; }
  #town { display: block; width: 100%; height: 420px; background: #5b8fb0; touch-action: none; }
  #viewbtns { position: absolute; right: 8px; top: 8px; display: flex; gap: 6px; }
  #viewbtns button { width: 36px; height: 36px; border-radius: 18px; border: 0; background: rgba(43,38,32,.72); color: #f6efe2; font-size: 18px; line-height: 1; }
  #staffchip { position: absolute; left: 8px; top: 34px; background: rgba(43,38,32,.72); color: #f6efe2; font-size: 12px; padding: 3px 9px; border-radius: 10px; pointer-events: none; font-variant-numeric: tabular-nums; }
  #townhint { position: absolute; left: 8px; top: 8px; background: rgba(43,38,32,.72); color: #f6efe2; font-size: 11px; padding: 3px 8px; border-radius: 10px; pointer-events: none; }
  /* 下のメニュー：中身が多いときは、メニューの中で縦にスクロールできる。pointer-events を none にすると、スマホでスクロールできず、上が見切れるので、メニュー自体がタッチを受ける（中身の高さぶんだけ。空のときは受けない） */
  #sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: min(58%, calc(100% - 16px)); overflow-y: auto; padding: 0 8px 8px; touch-action: pan-y; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
  #sheet:empty { pointer-events: none; padding: 0; }
  /* 建設中の帯：高さ一定（建設が増えても地図の位置が変わらない）。タップで全件の一覧が地図の上に重なって開く */
  #queue { position: relative; height: 34px; margin-bottom: 8px; z-index: 6; }
  #queue .qbar { height: 34px; box-sizing: border-box; display: flex; align-items: center; gap: 6px; padding: 0 12px; border: 1px solid #e7c9a8; background: #fff8ef; border-radius: 10px; font-size: 13px; font-weight: 700; }
  #queue .qbar.none { background: var(--card); border-color: var(--line); color: #8a7f70; font-weight: 400; }
  #queue .qarrow { margin-left: auto; font-size: 11px; color: #8a7f70; }
  #queue .qlist { position: absolute; left: 0; right: 0; top: 38px; max-height: 55vh; overflow-y: auto; margin: 0; box-shadow: 0 6px 18px rgba(0,0,0,.3); }
  #sheet .card { margin: 6px 0 0; box-shadow: 0 -2px 10px rgba(0,0,0,.25); }
  #sheet .btns { gap: 6px; }
  .tbtn { display: inline-block; width: calc(50% - 4px); text-align: left; margin-top: 6px; vertical-align: top; font-size: 13px; }
</style>
</head>
<body>
<main>
  <div id="townwrap"><canvas id="town"></canvas><div id="townhint">ドラッグで移動・ピンチで拡大・タップで選択</div><div id="staffchip"></div><div id="viewbtns"><button type="button" title="マップを回す" onclick="iso.rotate(1)">⟳</button></div><div id="sheet"></div></div>
</main>

<script src="../data/resources.js"></script>
<script src="../data/buildings.js"></script>
<script src="../data/leases.js"></script>
<script src="../data/difficulty.js"></script>
<script src="../data/loans.js"></script>
<script src="../data/port.js"></script>
<script src="../data/events.js"></script>
<script src="../data/eras.js"></script>
<script src="../data/tree.js"></script>
<script src="../data/recipes.js"></script>
<script src="../data/research.js"></script>
<script src="../data/segments.js"></script>
<script src="../data/map.js"></script>
<script src="../data/sprites_nt.js"></script>
<script src="../data/sprites_bl.js"></script>
<script src="../js/save.js"></script>
<script src="../js/market.js"></script>
<script src="../js/engine.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/sprites.js"></script>
<script src="../js/sprites2.js"></script>
<script src="../js/sprites3.js"></script>
<script src="../js/iso.js"></script>
<script>
const $ = id => document.getElementById(id);
const E = Engine, G = GAME_DATA, M = E.fmtMoney;
let iso = null;
let sel = null;            // 選んだ建物の key
let cursor = null;         // タップした空きタイル
let placing = null;        // 建てる種類（場所を決める途中）。'module' のときは placingPlant の増設モジュール
let placingPlant = null;   // 増設モジュールを置く加工設備の id
let placingRot = 0;        // 建てる向き（0〜3。向きを選べない種類は 0 のまま。増設モジュールも自由に回せる）
let moveKey = null;        // 移設・置き直しの対象（key）。null なら新しく建てる
// ブループリント（配置の保存と貼り付け）。bpMode: null｜'menu'（一覧）｜'select'（建物を選んでいる）｜'paste'（貼り付ける場所を決めている）
let bpMode = null, bpKeys = new Set(), bpCur = null, bpAt = null;
const BPKEY = 'factorySim.blueprints.v1';
function bpLoad() { try { const a = JSON.parse(localStorage.getItem(BPKEY) || '[]'); return Array.isArray(a) ? a.filter(b => b && Array.isArray(b.items) && b.items.length) : []; } catch (e) { return []; } }
function bpStore(list) { try { localStorage.setItem(BPKEY, JSON.stringify(list.slice(0, 30))); } catch (e) {} }
function bpClear() { bpMode = null; bpKeys = new Set(); bpCur = null; bpAt = null; if (iso) { iso.multi = null; iso.ghosts = null; } }
function bpOpen() { if (!E.blueprintUnlocked(UI.state)) { UI.toast(E.BLUEPRINT_LOCK); return; } sel = null; cursor = null; placing = null; iso.selected = null; iso.cursor = null; iso.ghost = null; bpMode = 'menu'; UI.refresh(); }
function bpStartSelect() { bpClear(); bpMode = 'select'; bpKeys = new Set(); iso.multi = bpKeys; UI.refresh(); }
function bpSelectedBlueprint() { return E.blueprintFromKeys(UI.state, [...bpKeys]); }
function bpSave() {
  const bp = bpSelectedBlueprint(); if (!bp) { UI.toast('建物を1つ以上選んでください'); return; }
  const list = bpLoad(), name = (prompt('ブループリントの名前', '配置' + (list.length + 1)) || '').trim(); if (!name) return;
  list.unshift({ name, items: bp.items, w: bp.w, d: bp.d, at: Date.now() }); bpStore(list); bpClear(); bpMode = 'menu'; UI.toast(`保存しました（${bp.items.length}件）`); UI.refresh();
}
function bpDelete(i) { const list = bpLoad(); if (!list[i] || !confirm(`「${list[i].name}」を削除します。よろしいですか？`)) return; list.splice(i, 1); bpStore(list); UI.refresh(); }
function bpStartPaste(i) {
  const bp = bpLoad()[i]; if (!bp) return;
  bpClear(); bpMode = 'paste'; bpCur = bp;
  const c = cursor || (iso && iso.unproject(iso.w / 2, iso.h / 2)) || { x: 15, y: 18 };
  bpAt = { x: Math.floor(c.x), y: Math.floor(c.y) }; bpUpdateGhosts(); if (iso) iso.center(bpAt.x, bpAt.y); UI.refresh();
}
function bpOrigin() { return { ox: bpAt.x - Math.floor(bpCur.w / 2), oy: bpAt.y - Math.floor(bpCur.d / 2) }; }
function bpUpdateGhosts() {
  if (!bpCur || !bpAt) { iso.ghosts = null; return; }
  const { ox, oy } = bpOrigin(), chk = E.blueprintCheck(UI.state, bpCur, ox, oy);
  iso.ghosts = bpCur.items.map((it, i) => ({ type: it.type, x: ox + it.dx, y: oy + it.dy, rot: it.rot, ok: chk.items[i] && chk.items[i].ok }));
}
function bpConfirm() {
  if (!bpCur || !bpAt) return; const { ox, oy } = bpOrigin(), bp = bpCur;
  const r = UI.act(s => E.blueprintBuild(s, bp, ox, oy));
  if (r && r.ok) { UI.toast(`「${bp.name}」を貼り付けた（${r.n}件の建設を開始）`); bpClear(); UI.refresh(); }
}

// 建設メニューのカテゴリ（建物の category → 表示）
const CATS = [
  { id: 'factory', label: '🏭 工場', match: c => c === 'factory' },
  { id: 'store', label: '🛢️ 貯蔵・製油', match: c => c === 'storage' || c === 'refinery' || c === 'field' },
  { id: 'corp', label: '🏢 全社', match: c => c === 'power' || c === 'lab' || c === 'hq' }
];

function ghostAt(type, tile) { const rot = E.cleanRot(type, placingRot), [fw, fd] = E.footprintOf(type, rot); return { type, rot, x: tile.x - Math.floor(fw / 2), y: tile.y - Math.floor(fd / 2), moveKey }; }
// 増設モジュールの足あと（親と同じ向き。親の種類ごとに大きさが違う）
function modFoot(p, rot) { return p ? E.footprintOf('module', rot === undefined ? E.parentRot(UI.state, p) : rot, p.type) : [2, 2]; }
function modGhost(p, tile) { const [mw, md] = modFoot(p, placingRot); return { type: 'module', plantId: p.id, rot: placingRot, x: tile.x - Math.floor(mw / 2), y: tile.y - Math.floor(md / 2), moveKey }; }
// 建てる向きを回す（置く場所の中心は動かさない）。d＝+1/−1
function rotatePlacing(d) {
  if (!placing) return;
  if (placing === 'module') {   // 増設モジュールは、親と独立に4方向へ回せる
    const p = UI.state.plants.find(q => q.id === placingPlant); if (!p) return;
    placingRot = (placingRot + d + 4) % 4; if (cursor) iso.ghost = modGhost(p, cursor); UI.refresh(); return;
  }
  if (!E.canRotate(placing)) return;
  placingRot = (placingRot + d + 4) % 4;
  if (cursor) iso.ghost = ghostAt(placing, cursor);
  UI.refresh();
}
document.addEventListener('keydown', ev => { if (ev.ctrlKey || ev.metaKey || ev.altKey) return; if (ev.key === 'r' || ev.key === 'R') rotatePlacing(1); });
// マップの高さ＝画面の残り（ヘッダーの下から下部ナビの上まで）。マップと操作を1画面に収める
function fitMap() {
  const cv = $('town'), nav = document.getElementById('nav'), top = cv.getBoundingClientRect().top + window.scrollY, navH = nav ? nav.offsetHeight : 58;   // 建設中の帯は高さ一定なので、そのまま数える
  const h = Math.max(300, Math.round((window.innerHeight || document.documentElement.clientHeight) - top - navH));
  if (cv.style.height !== h + 'px') { cv.style.height = h + 'px'; window.dispatchEvent(new Event('resize')); }
}
window.addEventListener('resize', fitMap); window.addEventListener('orientationchange', fitMap);
function startPlacing(type) {
  // 敷地に重ねて建てる設備（研究棟）：すでに敷地があれば、場所を選ばずにそこへ重ねて建てる（増設のたびに建屋が1段階高層になる）
  if (E.stackCfg(type)) E.ensureMap(UI.state);
  if (E.stackCfg(type) && E.stackSite(UI.state, type)) { UI.act(s => { const r = E.build(s, type); if (r && r.ok) UI.toast('増築を始めた（建屋が1段階高層になる）'); return r; }); return; }
  placing = type; sel = null; placingRot = 0; moveKey = null;
  const c = cursor || (iso && iso.unproject(iso.w / 2, iso.h / 2)) || { x: 15, y: 18 };
  const [fw, fd] = E.footprintOf(type), spot = E.findSpot(UI.state, type, { x: Math.floor(c.x) - Math.floor(fw / 2), y: Math.floor(c.y) - Math.floor(fd / 2) });   // 見ている場所に一番近い空き
  const tile = spot ? { x: spot.x + Math.floor(fw / 2), y: spot.y + Math.floor(fd / 2) } : { x: Math.floor(c.x), y: Math.floor(c.y) };
  cursor = tile; iso.ghost = ghostAt(type, tile); iso.cursor = null; iso.selected = null; if (spot && iso) iso.center(spot.x + fw / 2, spot.y + fd / 2);
  UI.refresh();
}
// 建物の移設：今の場所と向きから始めて、場所と向きを選び直す（増設モジュールは本体について動く）
function startMove(key) {
  const s = UI.state, q = s.map && s.map.placed[key]; if (!q) return;
  placing = q.type; moveKey = key; sel = null; iso.selected = null; placingRot = q.rot || 0;
  const [fw, fd] = E.footprintOf(q.type, placingRot); cursor = { x: q.x + Math.floor(fw / 2), y: q.y + Math.floor(fd / 2) };
  iso.ghost = { type: q.type, rot: placingRot, x: q.x, y: q.y, moveKey }; iso.cursor = null; UI.refresh();
}
// 増設モジュールの置き直し
function startModuleMove(key) {
  const s = UI.state, q = s.map && s.map.placed[key], p = q && s.plants.find(pp => pp.key === q.parent); if (!p) return;
  placing = 'module'; placingPlant = p.id; moveKey = key; sel = null; iso.selected = null; placingRot = q.rot || 0;
  const [mw, md] = modFoot(p, placingRot); cursor = { x: q.x + Math.floor(mw / 2), y: q.y + Math.floor(md / 2) };
  iso.ghost = { type: 'module', plantId: p.id, rot: placingRot, x: q.x, y: q.y, moveKey }; iso.cursor = null; UI.refresh();
}
function demolishSel(key) {
  const s = UI.state, q = s.map && s.map.placed[key]; if (!q) return;
  const name = q.type === 'module' ? '増設モジュール' : (G.buildings[q.type] || {}).name, v = E.demolishValue(s, key);
  if (!confirm(`${name}を撤去します。${M(v)}が戻ります（建設費の${Math.round(((G.relocate || {}).refund || 0.5) * 100)}%）。\nよろしいですか？`)) return;
  const r = UI.act(s2 => E.demolish(s2, key)); if (r && r.ok) { sel = null; iso.selected = null; UI.toast('撤去しました'); }
}
function startModule(plantId) {
  const s = UI.state, p = s.plants.find(q => q.id === plantId); if (!p) return;
  placing = 'module'; placingPlant = plantId; moveKey = null; sel = null; iso.selected = null; placingRot = E.parentRot(s, p);   // 向きの初期値は親と同じ（回せる）
  const spot = E.findModuleSpot(s, p, placingRot), [mw, md] = modFoot(p, placingRot);
  if (spot) { cursor = { x: spot.x + Math.floor(mw / 2), y: spot.y + Math.floor(md / 2) }; iso.ghost = { type: 'module', plantId, rot: placingRot, x: spot.x, y: spot.y }; iso.center(spot.x + mw / 2, spot.y + md / 2); }
  else { cursor = null; iso.ghost = { type: 'module', plantId, rot: placingRot, x: -9, y: -9 }; }
  UI.refresh();
}
// メニューを閉じる（×）：建設・置き直しの途中ならやめる。そうでなければ、選んでいる建物・タイルの選択を外す
function closeSheet() { if (bpMode) { bpClear(); UI.refresh(); return; } if (placing) { cancelPlacing(); return; } sel = null; cursor = null; if (iso) { iso.selected = null; iso.cursor = null; } UI.refresh(); }
function cancelPlacing() { placing = null; placingPlant = null; placingRot = 0; moveKey = null; iso.ghost = null; UI.refresh(); }
function confirmPlacing() {
  const gh = iso.ghost; if (!gh || !placing) return;
  if (placing === 'module') {
    const mk = moveKey, r = UI.act(s => mk ? E.moveModule(s, mk, { x: gh.x, y: gh.y, rot: placingRot }) : E.buildModule(s, placingPlant, { x: gh.x, y: gh.y, rot: placingRot }));
    if (r && r.ok && !mk) {   // 新しく建てるときは、上限まで続けて置ける（×か「やめる」で終了）。置き直しは1回で終わり
      const p2 = UI.state.plants.find(q => q.id === placingPlant), cb = p2 ? E.canBuildModule(UI.state, p2) : { ok: false };
      if (cb.ok) { iso.ghost = null; cursor = null; iso.cursor = null; UI.toast(`増設モジュールを置いた。続けて置ける（あと${E.moduleMax(p2.type) - E.moduleCount(UI.state, p2)}個まで。×で終了）`); UI.refresh(); return; }
    }
    if (r && r.ok) { placing = null; placingPlant = null; placingRot = 0; moveKey = null; iso.ghost = null; cursor = null; iso.cursor = null; UI.toast(mk ? '増設モジュールを置き直した' : '増設モジュールの建設を開始'); }
    return;
  }
  const type = placing, mk = moveKey, r = UI.act(s => mk ? E.relocate(s, mk, { x: gh.x, y: gh.y, rot: placingRot }) : E.build(s, type, null, { x: gh.x, y: gh.y, rot: placingRot }));
  if (r && r.ok) { placing = null; placingRot = 0; moveKey = null; iso.ghost = null; cursor = null; iso.cursor = null; UI.toast(mk ? `${G.buildings[type].name}の移設を開始` : `${G.buildings[type].name}の建設を開始`); }
}

function onTap(info) {
  const s = UI.state;
  if (bpMode === 'select') {   // 建物をタップして、選ぶ／外す（増設モジュール・港は選ばない）
    const e = info.ent;
    if (e && e.type !== 'module' && e.type !== '_port') { if (bpKeys.has(e.key)) bpKeys.delete(e.key); else bpKeys.add(e.key); iso.multi = bpKeys; }
    UI.refresh(); return;
  }
  if (bpMode === 'paste') { bpAt = { x: info.tile.x, y: info.tile.y }; bpUpdateGhosts(); UI.refresh(); return; }
  if (placing === 'module') { const p = s.plants.find(q => q.id === placingPlant); if (p) { cursor = info.tile; iso.ghost = modGhost(p, info.tile); } UI.refresh(); return; }
  if (placing) {
    cursor = info.tile; iso.ghost = ghostAt(placing, info.tile); UI.refresh(); return;
  }
  if (info.ent && info.ent.type !== '_port') { sel = info.ent.key; cursor = null; iso.selected = sel; iso.cursor = null; UI.refresh(); return; }
  sel = null; iso.selected = null;
  const t = E.terrainAt(s, info.tile.x, info.tile.y);
  if (t === 'land') { cursor = info.tile; iso.cursor = info.tile; }
  else { cursor = null; iso.cursor = null; if (t === 'sea') UI.toast('海です。建てる場所を選んだあとの画面で「埋め立てる」ができます'); else if (t === 'road') UI.toast('道路です'); else if (t === 'port') UI.toast('港の用地です'); else if (t === 'forest') UI.toast('森林地帯です（建物は置けません）'); }
  UI.refresh();
}

function statusOf(s, e) {
  if (e.moving) return `<b class="warn">移設中</b> 残り${E.fmtDuration(e.daysLeft)}${e.plant ? '（設備は止まっている）' : ''}`;
  if (e.building) return `<b class="warn">建設中</b> 残り${E.fmtDuration(e.daysLeft)}`;
  const p = e.plant;
  if (p) { const r = p.last && p.last.reason; return r === 'ok' ? '<b class="good">稼働中</b>' : r === 'input' ? '<b class="bad">原料不足</b>' : r === 'full' ? '<b class="bad">置き場が満杯</b>' : r === 'cash' ? '<b class="bad">資金不足</b>' : r === 'import' ? '<b class="bad">輸入の上限（自前の原料が要る）</b>' : '<span class="sub">停止中</span>'; }
  if (e.type === 'refinery' || e.type === 'refineryLarge') return E.refineryOnline(s) ? '<b class="good">稼働中</b>' : '<span class="sub">停止中</span>';
  if (e.type === 'powerPlant') return s.power && s.power.gen > 0 ? `<b class="good">発電 ${E.fmtNum(s.power.gen)}MWh/日</b>` : '<span class="sub">発電していない</span>';
  return '';
}

// 加工設備の、いまの稼働の月あたりの流れ（消費・産出・収支）。折りたたみ（既定で開く）
const fq = v => v >= 100 ? E.fmtNum(v) : v >= 1 ? String(parseFloat(v.toFixed(1))) : v > 0 ? String(parseFloat(v.toPrecision(2))) : '0';
function flowHtml(s, p, key) {
  const f = E.plantFlow(s, p, { cost: !!(UI.costMode && UI.costMode()) }); if (!f) return '';
  const R = G.resources, sgn = v => `<b class="${v >= 0 ? 'good' : 'bad'}">${v >= 0 ? '+' : '-'}${M(Math.abs(v))}</b>`;
  const stall = f.reason && f.reason !== 'ok' && f.t < f.rated - 1e-9;
  const why = stall ? `<div class="sub bad">⚠ ${f.reason === 'input' ? '原料が足りない' + (f.short ? '：' + R[f.short].name : '') : f.reason === 'cash' ? '資金が足りず原料を買えない' : f.reason === 'full' ? '置き場が満杯' : f.reason === 'import' ? '輸入で動かせる量の上限に達した。これ以上は、自前で原料を作らないと動かない' : ''}　定格の ${f.rated > 0 ? Math.round(f.t / f.rated * 100) : 0}% で動いている</div>` : '';
  const ii = f.imp, impNote = ii && (ii.share > 0.01 || f.reason === 'import') ? `<div class="sub bad" style="margin-top:4px">⚠ 輸入の原料で動いている（動かした量の${Math.round(ii.share * 100)}%）。利益は、自前の原料のときの <b>${Math.round(ii.profitShare * 100)}%</b> まで下がる。自前で原料を作らないと稼げない。輸入で動かせるのは、増設満杯の1基ぶんまで（いま ${fq(ii.used)}／${fq(ii.cap)}）。</div>` : '';
  const row = (a, b, c) => `<div class="row" style="gap:6px"><span class="sub" style="flex:1">${a}</span><span class="sub num">${b}</span><span class="sub num" style="min-width:5.2em;text-align:right">${c || ''}</span></div>`;
  const body = `${UI.costToggle ? UI.costToggle() : ''}${why}${impNote}
    <div class="sub" style="margin-top:4px"><b>使う（月）</b>　${f.ran ? '昨日の実績×30日' : '能力×稼働率×30日'}</div>
    ${f.ins.map(i => row(`${R[i.k].name}${i.share >= 0.99 ? '（買う）' : i.buy ? `（${i.inhouse ? '自社品' : '在庫'}＋買う${Math.round(i.share * 100)}%）` : i.inhouse ? '（自社品・原価）' : '（在庫）'}`, `${fq(i.qty)}${R[i.k].unit}`, `${M(i.cost)}${isFinite(i.stockDays) && i.share < 0.99 ? `<br><span class="${i.stockDays < 3 ? 'bad' : ''}">在庫${i.stockDays >= 100 ? '100日超' : fq(i.stockDays) + '日分'}</span>` : ''}`)).join('')}
    <div class="sub" style="margin-top:4px"><b>作る（月）</b></div>
    ${f.outs.map(o => row(R[o.k].name + (o.inhouse ? `（うち自社で使う${Math.round(o.inhouse * 100)}%＝原価で受け渡し）` : ''), `${fq(o.qty)}${R[o.k].unit}`, o.sellable || o.inhouse ? M(o.value) : '売れない')).join('')}

    ${row('売上', '', M(f.revenue))}${row('原料', '', '-' + M(f.inCost))}${f.fee !== 0 ? row('輸入の罰（買った原料の割合ぶん。買値の割増は含む。Tier ' + E.nodeDef(E.nodeOfRecipe(p.recipe)).tier + '）', '', (f.fee > 0 ? '-' : '+') + M(Math.abs(f.fee))) : ''}${row('操業費', '', '-' + M(f.opex))}${row('維持費', '', '-' + M(f.fixed))}

}

function renderSheet(s) {

        <div class="btns" style="margin-top:8px"><button class="btn" ${n ? '' : 'disabled'} onclick="bpSave()">保存する</button> <button class="btn small" onclick="bpOpen()">一覧へ</button> <button class="btn small" onclick="closeSheet()">やめる</button></div></div>`);
    } else if (bpMode === 'paste' && bpCur) {
      bpUpdateGhosts();

      out.push(`<div class="card"><div class="row"><h3>📐 ${bpCur.name}を貼り付ける</h3><span style="display:flex;align-items:center"><span class="sub">${bpCur.items.length}件・${M(chk.cost)}</span><button type="button" class="xbtn" onclick="closeSheet()" aria-label="閉じる">×</button></span></div>
        <div class="sub">マップをタップして場所を決める（緑なら置ける・赤は置けない）。全部置けて資金が足りるときだけ建てられる。</div>

    }

  }
  if (placing === 'module') {

    if (!p) { placing = null; iso.ghost = null; }
    else {
      const b = G.buildings[p.type], MC = E.moduleCfg(), mv = !!moveKey, rot = gh && gh.rot !== undefined ? gh.rot : placingRot;
      const chk = gh ? (mv ? E.canMoveModule(s, moveKey, { x: gh.x, y: gh.y, rot }) : E.canPlaceModule(s, p, gh.x, gh.y, undefined, rot)) : { ok: false, msg: 'マップをタップして場所を決める' }, cb = mv ? { ok: true } : E.canBuildModule(s, p);
      const add = E.plantCap(E.plantDef(p), G.recipes[p.recipe]) * MC.gain, mfill = chk.fill ? chk.fill.length : 0, mfillFee = E.fillCost(s, mfill), fee = mv ? (chk.cost !== undefined ? chk.cost : Math.round(((G.relocate || {}).fee || 0.2) * E.moduleCost(s, p))) : ((cb.cost || E.moduleCost(s, p)) + mfillFee);
      out.push(`<div class="card"><div class="row"><h3>🧱 ${b.name}の増設モジュール${mv ? 'を置き直す' : ''}</h3><span style="display:flex;align-items:center"><span class="sub">${M(fee)}</span><button type="button" class="xbtn" onclick="closeSheet()" aria-label="閉じる">×</button></span></div>

        ${mfill ? `<div class="sub" style="margin-top:4px">🌊 海の上に置く：${mfill}マスを埋め立てる（＋${M(mfillFee)}）</div>` : ''}
        <div style="margin-top:6px">場所：${chk.ok ? '<b class="good">置ける</b>' : `<b class="bad">${chk.msg}</b>`}${cb.ok ? '' : `　<b class="bad">${cb.msg}</b>`}</div>

  }
  if (placing) {
    const b = G.buildings[placing], gh = iso.ghost, mv = !!moveKey, chk = gh ? (mv ? E.planRelocate(s, moveKey, { x: gh.x, y: gh.y, rot: E.cleanRot(placing, placingRot) }) : E.canPlace(s, placing, gh.x, gh.y, null, E.cleanRot(placing, placingRot))) : { ok: false, msg: 'マップをタップして場所を決める' };
    const cb0 = mv ? { ok: true } : E.canBuild(s, placing), fillN = chk.fill ? chk.fill.length : 0, fillFee = E.fillCost(s, fillN);

    out.push(`<div class="card"><div class="row"><h3>${b.icon || ''} ${b.name}${mv ? 'を移設する' : 'を建てる'}</h3><span style="display:flex;align-items:center"><span class="sub">${mv ? (chk.cost !== undefined ? M(chk.cost) + '（建設費の2割）' : '') : M(E.costOf(s, placing)) + '・' + E.buildText(b.months)}</span><button type="button" class="xbtn" onclick="closeSheet()" aria-label="閉じる">×</button></span></div>
      <div class="sub">マップをタップして場所を決める（緑なら置ける）。足あと ${E.footprintOf(placing, E.cleanRot(placing, placingRot)).join('×')}${E.canRotate(placing) ? '（向きを回せる）' : ''}</div>
      <div style="margin-top:6px">場所：${chk.ok ? '<b class="good">置ける</b>' : `<b class="bad">${chk.msg}</b>`}${cb.ok ? '' : `　<b class="bad">${cb.msg}</b>`}</div>
      ${fillInfo}
      <div class="btns" style="margin-top:8px"><button class="btn" ${chk.ok && cb.ok ? '' : 'disabled'} onclick="confirmPlacing()">${mv ? '移設する' : '建設する'}</button> ${E.canRotate(placing) ? '<button class="btn small" onclick="rotatePlacing(1)">⟳ 回す</button> ' : ''}<button class="btn small" onclick="cancelPlacing()">やめる</button></div></div>`);
  } else if (sel) {
    let e = (iso.ents || []).find(q => q.key === sel);
    if (e && e.type === 'module') {   // 増設モジュール：置き直しと撤去（本体は親の建物をタップ）
      const par = (iso.ents || []).find(q => q.key === e.parent), pb = par && G.buildings[par.type], RC = G.relocate || { fee: 0.2, refund: 0.5 }, pp = par && par.plant;
      out.push(`<div class="card"><div class="row"><h3>🧱 ${pb ? pb.name : ''}の増設モジュール</h3><span>${e.moving || e.building ? '<b class="warn">建設中</b>' : ''}</span></div>
        <div class="sub">日量 +${Math.round(E.moduleCfg().gain * 100)}%。置き直しは建設費の${Math.round(RC.fee * 100)}%、撤去すると${Math.round(RC.refund * 100)}%が戻る（${pp ? M(E.demolishValue(s, sel)) : ''}）。</div>
        <div class="btns" style="margin-top:8px">${e.building || (par && (par.moving || par.building)) ? '' : `<button class="btn small" onclick="startModuleMove('${sel}')">🔧 置き直す</button> <button class="btn small" onclick="demolishSel('${sel}')">🗑️ 撤去</button> `}<button class="btn small" onclick="sel=null;iso.selected=null;UI.refresh()">閉じる</button></div></div>`);
      e = null;
    }
    if (e && e.type !== 'module') {
      const b = G.buildings[e.type], p = e.plant, rec = p && G.recipes[p.recipe];
      out.push(`<div class="card"><div class="row"><h3>${b.icon || ''} ${b.name}</h3><span style="display:flex;align-items:center">${statusOf(s, e)}<button type="button" class="xbtn" onclick="closeSheet()" aria-label="閉じる">×</button></span></div>
        ${rec ? `<div class="sub">生産：${rec.name}（稼働率 ${Math.round(p.runRate * 100)}%）　日量 ${E.fmtNum(E.plantCapOf(p))}</div>` : ''}
        ${p && !e.building && !e.moving ? flowHtml(s, p, sel) : ''}
        ${p && !e.building && E.hasModule(p.type) ? (() => { const n = E.moduleCount(s, p), MC = E.moduleCfg(), cb = E.canBuildModule(s, p); return `<div class="row" style="margin-top:6px"><span class="sub">🧱 増設モジュール ${n}/${E.moduleMax(p.type)}（1個で日量+${Math.round(MC.gain * 100)}%・${M(E.moduleCost(s, p))}）</span><button class="btn small" ${n >= E.moduleMax(p.type) || !cb.ok ? 'disabled' : ''} onclick="startModule(${p.id})">置く</button></div>`; })() : ''}
        ${p && !e.building ? (() => { const def = E.plantDef(p), rate = Math.round(p.runRate * 100);
          const chips = def && def.recipes.length > 1 ? `<div class="chips" style="margin-top:6px">${def.recipes.map(id => E.recipeUnlocked(s, id) ? `<span class="chip ${p.recipe === id ? 'on' : ''}" onclick="UI.act(s=>Engine.setPlantRecipe(s,${p.id},'${id}'))">${G.recipes[id].name}</span>` : `<span class="chip" style="opacity:.45" onclick="UI.toast('${E.recipeLockReason(s, id)}')">🔒 ${G.recipes[id].name}</span>`).join('')}</div>` : '';
          return `${chips}<div class="row" style="margin-top:6px"><span class="sub">稼働率</span><div class="chips">${[0, 25, 50, 75, 100].map(r => `<span class="chip ${rate === r ? 'on' : ''}" onclick="UI.act(s=>Engine.setPlantRate(s,${p.id},${r / 100}))">${r}%</span>`).join('')}</div></div>
          <label class="row" style="margin-top:6px"><span class="sub">原料が足りない分を市場から買う（輸入）</span><input type="checkbox" ${p.autoBuy ? 'checked' : ''} onchange="UI.act(s=>Engine.setPlantAutoBuy(s,${p.id},this.checked))"></label>${E.importRatio(p.recipe) < 1 ? `<div class="sub warn">⚠ 買う（輸入）と、利益は自前の原料のときの${Math.round(E.importRatio(p.recipe) * 100)}%まで下がり、輸入で動かせるのも、増設満杯の1基ぶんまで。自前で原料を作る工場が要る。</div>` : ''}`; })() : ''}
        <div class="sub">${b.desc || ''}</div>
        <div style="margin-top:6px">${p ? '<a href="factory.html">工場の設定へ</a>　' : e.type === 'refinery' || e.type === 'refineryLarge' || e.type === 'distillation' ? '<a href="refinery.html">製油所へ</a>　' : ''}${!e.building && !G.buildings[e.type].needsSite && !E.stackCfg(e.type) && e.type !== '_port' ? `<button class="btn small" onclick="startMove('${sel}')">🔧 移設</button> <button class="btn small" onclick="demolishSel('${sel}')">🗑️ 撤去</button> ` : ''}<button class="btn small" onclick="sel=null;iso.selected=null;UI.refresh()">閉じる</button></div></div>`);
    }
  } else if (cursor) {

    const items = CATS.find(c => c.id === cat) || CATS[0];

      ${UI.chips('town-cat', CATS.map(c => ({ id: c.id, label: c.label })), items.id)}

  } else {
    const n = (iso.ents || []).length;
    out.push(`<div class="card sub">建物をタップすると詳しく、空き地をタップするとそこに建てられます。${n ? `（建物 ${n}）` : ''}　油井は<a href="field.html">採掘地</a>で建てます。${E.blueprintUnlocked(s) ? `<div class="btns" style="margin-top:6px"><button class="btn small" onclick="bpOpen()">📐 ブループリント</button></div>` : ''}</div>`);
  }
  setSheet(out.join(''));
}
// メニュー（下のシート）の中身を入れ替えるとき、スクロールの位置を保つ（毎日の更新でメニューが一番上に戻らないように）
function setSheet(html) { const sh = $('sheet'), top = sh.scrollTop; UI.html('sheet', html); if (sh.scrollTop !== top) sh.scrollTop = top; }

function render(s) {
  { const st = E.staffTotal ? E.staffTotal(s) : null, el = $('staffchip'); if (st && el) { const t = '👷 従業員 ' + st.total.toLocaleString('ja-JP') + '人'; if (el.textContent !== t) el.textContent = t; el.title = `施設 ${st.base.toLocaleString('ja-JP')}／増設モジュール ${st.modules.toLocaleString('ja-JP')}／採掘 ${st.field.toLocaleString('ja-JP')}`; } }
  if (!iso) {
    for (const k in (G.spritesNT || {})) { const m = G.spritesNT[k]; Sprites.H[k] = Math.max(8, Math.round((m.ay - (m.fw + m.fd) * 8) / 1.4)); }   // PNGの絵の当たり判定の高さ：足あとの奥の頂点Aから絵の上端まで（描画の高さ倍率 HS=1.4 を割り戻す）
    for (const k in (G.spritesBL || {})) { const m = G.spritesBL[k]; Sprites.H[k] = Math.max(8, Math.round(Math.max(...m.r.map(r => r.ay - (r.fw + r.fd) * 8)) / 1.4)); }   // Blender の絵：向きのうち一番高いもの
    iso = Iso.create($('town'), { getState: () => UI.state, onTap, onChanged: () => UI.save() });
    iso.start();
    const qp = new URLSearchParams(location.search);   // 確認用：?era=2&zoom=0.6&cx=15&cy=15（時代・拡大・中心を固定）
    if (qp.get('era') || qp.get('zoom')) iso.buildAll = true;   // 確認用：構築の枠を使わず、最初のフレームで全部描く
    if (qp.get('portgrade') != null) iso.portOverride = Math.max(0, Math.min(5, Math.round(+qp.get('portgrade')) || 0));   // 確認用：?portgrade=0〜5（港のグレードを固定）
    if (qp.get('era')) iso.eraOverride = Math.max(1, Math.min(6, Math.round(+qp.get('era')) || 1));
    if (qp.get('zoom')) { iso.cam.z = +qp.get('zoom'); iso.center(+(qp.get('cx') || 15), +(qp.get('cy') || 15)); }
    if (qp.get('view')) { iso.resize && iso.resize(); iso.setView(+qp.get('view') || 0); }   // 確認用：?view=0〜3（視点の向き）
    const b = qp.get('build');
    if (b && G.buildings[b] && !E.offMap(b)) startPlacing(b);
    // 確認用：?sel=plant|module（最初の設備・モジュールを選ぶ）、?move=plant|module（その移設・置き直しを始める）
    { const ents = E.mapEntities(UI.state), pick = w => ents.find(e => w === 'module' ? e.type === 'module' : (e.plant && !e.building));
      const sv = qp.get('sel'), mvv = qp.get('move'), tgt = pick(sv || mvv);
      if (tgt && sv) { sel = tgt.key; iso.selected = sel; }
      if (tgt && mvv) { if (mvv === 'module') startModuleMove(tgt.key); else startMove(tgt.key); } }
    // 確認用：?bp=menu（ブループリントの一覧）／?bp=select（建物を3つ選んだ状態）／?bp=paste（建物3つを保存して、貼り付けの見本を出す）
    { const bm = qp.get('bp'); if (bm === 'menu') bpOpen();
      else if (bm === 'select' || bm === 'paste') { bpStartSelect(); for (const e of E.mapEntities(UI.state).filter(e => e.type !== 'module' && e.type !== '_port').slice(0, 3)) bpKeys.add(e.key); iso.multi = bpKeys;
        if (bm === 'paste') { const bp = bpSelectedBlueprint(); if (bp) { bpClear(); bpMode = 'paste'; bpCur = Object.assign({ name: '見本' }, bp); const c = iso.unproject(iso.w / 2, iso.h / 2) || { x: 15, y: 18 }; bpAt = { x: Math.floor(c.x) + 6, y: Math.floor(c.y) + 6 }; bpUpdateGhosts(); } } UI.refresh(); } }
    const mp = +(new URLSearchParams(location.search).get('module')) || 0;
    if (mp) startModule(mp);
    if (b || mp) try { history.replaceState(null, '', location.pathname); } catch (e) {}   // 再読み込みで場所選びが再開しないように
  }
  renderSheet(s); fitMap();   // 建設キューなどでマップの位置が動いても、下部ナビの下に隠れないよう高さを合わせ直す
}
UI.boot({ page: 'town', render });
fitMap(); setTimeout(fitMap, 300);
