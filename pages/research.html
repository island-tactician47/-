<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#26221e">
<title>研究（技術ツリー） - 工場地帯シミュ</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  .tier-h { display: flex; align-items: baseline; justify-content: space-between; margin: 14px 0 6px; }
  .node { border-left: 5px solid var(--line); }
  .node.u { border-left-color: #2e7d4f; }
  .node.c { border-left-color: #c27a1f; background: #fff8ee; }
  .node.s { border-left-color: #2b6f94; }
  .node.l { opacity: .78; }
  .badge { font-size: 11px; border-radius: 10px; padding: 1px 8px; border: 1px solid var(--line); white-space: nowrap; }
  .badge.u { background: #e4f3ea; color: #1f6a3f; border-color: #b8dcc6; }
  .badge.c { background: #fdecd2; color: #8a5200; border-color: #ecc78a; }
  .badge.s { background: #e3eef6; color: #1f5a7d; border-color: #b7d2e4; }
  .chips2 { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
  .chip2 { font-size: 11px; border: 1px solid var(--line); border-radius: 10px; padding: 1px 7px; }
  .chip2.ok { background: #e4f3ea; border-color: #b8dcc6; color: #1f6a3f; }
  .chip2.ng { background: #f8e6e3; border-color: #e3b7b0; color: #8f3326; }
  .sup td { padding: 2px 4px; font-size: 12px; }
  .sup td:nth-child(n+2) { text-align: right; white-space: nowrap; }
</style>
</head>
<body>
<main>
  <h2>🔬 研究（技術ツリー）</h2>
  <div class="card" id="head"></div>
  <div id="view"></div>
  <div id="tree"></div>
  <p class="sub" id="foot"></p>
</main>

<script src="../data/resources.js"></script>
<script src="../data/buildings.js"></script>
<script src="../data/leases.js"></script>
<script src="../data/difficulty.js"></script>
<script src="../data/loans.js"></script>
<script src="../data/port.js"></script>
<script src="../data/events.js"></script>
<script src="../data/eras.js"></script>
<script src="../data/tree.js"></script>
<script src="../data/recipes.js"></script>
<script src="../data/research.js"></script>
<script src="../data/segments.js"></script>
<script src="../data/map.js"></script>
<script src="../js/save.js"></script>
<script src="../js/market.js"></script>
<script src="../js/engine.js"></script>
<script src="../js/ui.js"></script>
<script>
const $ = id => document.getElementById(id);
const E = Engine, G = GAME_DATA, M = E.fmtMoney;
const qty = v => v >= 100 ? E.fmtNum(v) : v >= 1 ? String(parseFloat(v.toFixed(2))) : v > 0 ? String(parseFloat(v.toPrecision(2))) : '0';

// ノードの中身（建てられる設備・前提・選択権の素材・解放ボタン・理由）
function nodeBody(s, id) {
  const d = E.nodeDef(id), st = E.nodeState(s, id), R = G.resources;
  const needs = (d.needs || []).length ? `<div class="chips2">${d.needs.map(n => `<span class="chip2 ${E.nodeUnlocked(s, n) ? 'ok' : 'ng'}">${E.nodeUnlocked(s, n) ? '✓' : '✗'} ${E.nodeName(n)}</span>`).join('')}</div>` : '';
  const bs = (d.buildings || []).filter(b => !G.buildings[b].retired).map(b => `${G.buildings[b].icon || ''}${G.buildings[b].name}`).join('、');
  let body = `<div class="sub">${bs ? '建てられる：' + bs : ''}</div>${needs}`;
  if (!st.unlocked && !st.auto) {
    if (st.prereq) {
      if (!st.supply.measurable) body += '<div class="sub">選択権：生産の記録がたまるのを待つ（消費の記録つきで3か月）</div>';
      else if (st.supply.items.length) body += `<div class="sub" style="margin-top:4px">選択権：その工場を建てて回すぶん（増設なしの1基）の素材が、輸入なしで余っているか（直近${G.tree.config.supplyMonths}か月の生産−加工設備の消費）</div><table class="sup">${st.supply.items.map(i => `<tr><td>${i.ok ? '✓' : '✗'} ${R[i.k].name}</td><td>余り ${qty(i.have)}${R[i.k].unit}/日</td><td>必要 ${qty(i.need)}</td></tr>`).join('')}</table>`;
      else body += '<div class="sub">選択権：素材の条件はない（前提が開いていれば選べる）</div>';
    }
    if (st.canUnlock) body += `<div class="btns" style="margin-top:6px"><button class="btn small" onclick="pick('${id}')">このノードを開く（解放権${st.tickets.need}枚）</button></div>`;
    else if (st.reason) body += `<div class="sub ${st.selectable ? 'warn' : ''}" style="margin-top:4px">${st.reason}</div>`;
  }
  return body;
}
function badgeOf(st) {
  return st.unlocked ? '<span class="badge u">開いた</span>' : st.auto ? '<span class="badge">自動で開く</span>' : st.canUnlock ? `<span class="badge c">選べる・解放権${st.tickets.need}枚</span>` : st.selectable ? `<span class="badge s">選択権あり・解放権${st.tickets.need}枚（足りない）</span>` : `<span class="badge">解放権${st.tickets.need}枚</span>`;
}
function nodeCard(s, id) {
  const d = E.nodeDef(id), st = E.nodeState(s, id);
  return UI.fold('node-' + id, `<span style="display:flex;justify-content:space-between;align-items:center;gap:6px;width:100%"><b>${d.icon || ''} ${d.name}</b>${badgeOf(st)}</span>`, nodeBody(s, id), st.canUnlock || st.selectable);
}

// 技術ツリー（図）：Tier ごとの段に、描くノードだけを並べ、前提→ノードの線を引く。段の中の並びは、前提の位置の平均に合わせて線の交差を減らす。横にスクロールできる
let selId = null, centered = false, treeX0 = 0;
try { selId = localStorage.getItem('factorySim.ui.researchSel') || null; } catch (e) {}
function selectNodeUI(id) { selId = id; try { localStorage.setItem('factorySim.ui.researchSel', id); } catch (e) {} UI.refresh(); }
function treeSvg(s, ids) {
  // 図の作り（docs/技術ツリー案.png と同じ）：Tier ごとの段、ノードは固定の横位置（data/tree.js の x）、線は元のノードの色。描くノードだけを詰めて並べる
  const NW = 150, NH = 62, ROWGAP = 190, TOP = 40, TIERCOL = { 1: '#6b7b8c', 2: '#4f7f64', 3: '#4d6fa3', 4: '#7a4f9a', 5: '#a34d4d', 6: '#c28a1e' };
  const tiers = [...new Set(ids.map(id => E.nodeDef(id).tier))].sort((a, b) => a - b), ry = {}; tiers.forEach((t, r) => { ry[t] = TOP + r * ROWGAP; });
  const xs = ids.map(id => E.nodeDef(id).x), x0 = Math.min(...xs) - NW / 2 - 24, x1 = Math.max(...xs) + NW / 2 + 24, W = x1 - x0, H = TOP * 2 + (tiers.length - 1) * ROWGAP + NH + 12;
  treeX0 = x0;
  const cx = id => E.nodeDef(id).x - x0, top = id => ry[E.nodeDef(id).tier], outs = {}, ins = {};
  for (const id of ids) for (const n of E.nodeDef(id).needs || []) if (ids.includes(n) && E.nodeDef(n).tier !== E.nodeDef(id).tier) { (outs[n] = outs[n] || []).push(id);   // 同じ Tier どうしの線は描かない（化学→他の素材など。前提としては効いている）
     (ins[id] = ins[id] || []).push(n); }
  const slot = (list, key, id) => { const l = list.slice().sort((a, b) => E.nodeDef(a).x - E.nodeDef(b).x), i = l.indexOf(key), n = l.length; return n > 1 ? cx(id) - NW / 2 + 14 + (NW - 28) * (i + 0.5) / n : cx(id); };
  let edges = '', nodes = '';
  for (const id of ids) for (const n of ins[id] || []) {
    const ax = slot(outs[n], id, n), ay = top(n) + NH, bx = slot(ins[id], n, id), by = top(id), dy = (by - ay) * 0.5, on = E.nodeUnlocked(s, n);
    edges += `<path d="M${ax.toFixed(1)},${ay} C${ax.toFixed(1)},${ay + dy} ${bx.toFixed(1)},${by - dy} ${bx.toFixed(1)},${by}" fill="none" stroke="${E.nodeDef(n).color || '#888'}" stroke-width="3.5" opacity="${on ? 0.9 : 0.35}" ${on ? '' : 'stroke-dasharray="8 6"'}/><path d="M${bx.toFixed(1)},${by} l-6,-11 l12,0 z" fill="${E.nodeDef(n).color || '#888'}" opacity="${on ? 0.9 : 0.35}"/>`;
  }
  let heads = ''; for (const t of tiers) heads += `<text x="${(8).toFixed(0)}" y="${ry[t] - 10}" font-size="20" font-weight="700" fill="#8a8378">Tier ${t}</text>`;
  for (const id of ids) {
    const d = E.nodeDef(id), st = E.nodeState(s, id), tc = TIERCOL[d.tier] || '#888', x = cx(id) - NW / 2, y = top(id);
    const fill = st.unlocked ? '#e4f3ea' : st.canUnlock ? '#fde9c8' : st.selectable ? '#dcebf6' : '#fffdf8';
    const sub = st.unlocked ? '開いた' : st.auto ? '自動で開く' : st.canUnlock ? `選べる・解放権${st.tickets.need}枚` : st.selectable ? `選択権あり・解放権${st.tickets.need}枚` : `解放権${st.tickets.need}枚`;
    const subc = st.unlocked ? '#1f6a3f' : st.canUnlock ? '#8a5200' : st.selectable ? '#1f5a7d' : tc;
    nodes += `<g onclick="selectNodeUI('${id}')" style="cursor:pointer"><rect x="${x.toFixed(1)}" y="${y}" width="${NW}" height="${NH}" rx="12" fill="${fill}" stroke="${id === selId ? '#26221e' : tc}" stroke-width="${id === selId ? 6 : 4}"/>
      <text x="${(x + 12).toFixed(1)}" y="${y + 28}" font-size="23" font-weight="700" fill="#26221e">${d.name.length > 7 ? d.name.slice(0, 7) : d.name}</text>
      <text x="${(x + 12).toFixed(1)}" y="${y + 50}" font-size="15" fill="${subc}">${sub}</text></g>`;
  }
  const sc = +UI.tab('res-zoom', '0.55');
  return `<div id="treesc" style="overflow:auto;max-height:70vh;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;overscroll-behavior:contain;border:1px solid var(--line);border-radius:10px;background:#f2ede4"><svg width="${(W * sc).toFixed(0)}" height="${(H * sc).toFixed(0)}" viewBox="0 0 ${W.toFixed(0)} ${H}" style="display:block">${heads}${edges}${nodes}</svg></div>`;
}

function render(s) {
  const left = E.ticketsLeft(s), earned = E.ticketsEarned(s), steps = E.ticketSteps(), p12 = E.profit12(s), next = steps[earned];
  UI.html('head', `<div class="row"><h3>🎫 解放権</h3><b class="num">残り ${left}枚</b></div>
    <div class="sub">会社全体の直近12か月の利益が、段の額に届くたびに1枚ふえる（これまでに${earned}枚。減らない）。いまの利益 <b>${M(p12)}</b>${next ? `／次は <b>${M(next)}</b>` : '／これで最後'}。</div>
    <div class="sub" style="margin-top:4px">ノードを開く条件は二つ：<b>選択権</b>（その工場を回すぶんの素材が、輸入なしで余っている）と<b>解放権</b>（利益で貯まる）。</div>`);
  const view = UI.tab('res-view', 'tree');
  UI.html('view', UI.chips('res-view', [{ id: 'tree', label: '🌳 技術ツリー' }, { id: 'list', label: '📋 一覧' }], view) + (view === 'tree' ? '<div class="row" style="margin:4px 0"><span class="sub">図の大きさ</span>' + UI.chips('res-zoom', [{ id: '0.38', label: '小' }, { id: '0.55', label: '中' }, { id: '0.8', label: '大' }], UI.tab('res-zoom', '0.55')) + '</div>' : ''));
  const all = Object.keys(E.treeNodes()), ids = all.filter(id => E.nodeVisible(s, id)), hidden = all.length - ids.length;
  if (view === 'tree') {
    if (!selId || !ids.includes(selId)) selId = ids.find(id => E.nodeState(s, id).canUnlock) || ids.find(id => E.nodeState(s, id).selectable) || ids.find(id => !E.nodeUnlocked(s, id)) || ids[0];
    const d = E.nodeDef(selId), st = E.nodeState(s, selId);
    const sc0 = document.getElementById('treesc'), sx = sc0 ? sc0.scrollLeft : 0, sy = sc0 ? sc0.scrollTop : 0;   // 再描画（ノードを選んだとき）でスクロール位置が戻らないように覚えておく
    UI.html('tree', treeSvg(s, ids) + `<div class="card node ${st.unlocked ? 'u' : st.canUnlock ? 'c' : st.selectable ? 's' : 'l'}" style="margin-top:8px"><div class="row"><h3>${d.icon || ''} ${d.name} <span class="sub">Tier ${d.tier}</span></h3>${badgeOf(st)}</div>${nodeBody(s, selId)}</div>`);
    const sc1 = document.getElementById('treesc');
    if (sc1) {
      if (!centered) { centered = true; const zz = +UI.tab('res-zoom', '0.55'), nx = (E.nodeDef(selId).x - treeX0) * zz; sc1.scrollLeft = Math.max(0, nx - sc1.clientWidth / 2); }   // 最初は、選んでいるノードが真ん中に来るように
      else { sc1.scrollLeft = sx; sc1.scrollTop = sy; }
    }
  } else {
    const tiers = {}; for (const id of ids) (tiers[E.nodeDef(id).tier] = tiers[E.nodeDef(id).tier] || []).push(id);
    UI.html('tree', Object.keys(tiers).sort((a, b) => a - b).map(t => `<div class="tier-h"><h3>Tier ${t}</h3><span class="sub">${tiers[t].filter(id => E.nodeUnlocked(s, id)).length}／${tiers[t].length}</span></div>` + tiers[t].map(id => { const st = E.nodeState(s, id); return `<div class="card node ${st.unlocked ? 'u' : st.canUnlock ? 'c' : st.selectable ? 's' : 'l'}">${nodeCard(s, id)}</div>`; }).join('')).join(''));
  }
  UI.html('foot', (view === 'tree' ? '図：実線＝前提が開いている／点線＝前提がまだ。図は上下左右にスクロールできる。ノードをタップすると下に詳しく出る。' : '') + (hidden > 0 ? `見えているのは、開いたノードと、前提がそろったノード（選択権がなくても表示はする）。まだ見えていない産業が ${hidden} 個ある（前提のノードをすべて開くと現れる。最後の産業は、Tier 5 のうち4つを開くと現れる）。` : 'すべてのノードが見えている。'));
}
function pick(id) { const d = E.nodeDef(id); if (!confirm(`「${d.name}」を開きます（解放権${d.tickets}枚を使う）。よろしいですか？`)) return; UI.act(s => E.selectNode(s, id)); }
UI.boot({ page: 'research', render });
</script>
</body>
</html>
