<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#26221e">
<title>採掘地 - 工場地帯シミュ</title>
<link rel="stylesheet" href="../css/style.css">
<style>.pic{display:block;height:84px;margin:4px auto;image-rendering:auto}</style>
</head>
<body>
<main>
  <h2>🛢️ 採掘地</h2>
  <div id="ftabs"></div>
  <div id="oilview">
  <div class="card">
    <div class="row"><h3>産出と原油タンク</h3><span class="sub" id="wellcount"></span></div>
    <div class="grid2 num">
      <div>日量 <b id="rate"></b> bbl</div>
      <div>原油在庫 <b id="crude"></b></div>
    </div>
    <div class="bar" id="crudebar"><i></i></div>
    <div class="icons" id="tankicons"></div>
    <div class="sub" id="crudeinfo"></div>
    <div class="btns" style="margin-top:8px">
      <button class="btn sec small" id="b-tank" onclick="UI.act(s=>Engine.build(s,'crudeTank'))"></button>
      <a class="btn sec small" href="town.html?build=crudeTank" onclick="UI.save()">町の地図で場所を選ぶ</a>
    </div>
  </div>

  <h2>鉱区</h2>
  <div id="leases"></div>
  </div>
  <div id="mineview" style="display:none"></div>
  <div id="mapview" style="display:none">
    <canvas id="fmap" style="width:100%;height:55vh;min-height:320px;display:block;border-radius:10px;touch-action:none;background:#8fa273"></canvas>
    <div class="sub" style="margin:4px 2px">ドラッグで移動・ピンチで拡大・区画をタップで選択（半透明の建物は建設中）</div>
    <div id="mapinfo"></div>
  </div>

  <h2>出来事</h2>
  <div class="card log" id="log"></div>
</main>

<script src="../data/resources.js"></script>
<script src="../data/buildings.js"></script>
<script src="../data/leases.js"></script>
<script src="../data/difficulty.js"></script>
<script src="../data/loans.js"></script>
<script src="../data/port.js"></script>
<script src="../data/events.js"></script>
<script src="../data/eras.js"></script>
<script src="../data/tree.js"></script>
<script src="../data/recipes.js"></script>
<script src="../data/research.js"></script>
<script src="../data/segments.js"></script>
<script src="../data/map.js"></script>
<script src="../data/sprites_bl.js"></script>
<script src="../js/save.js"></script>
<script src="../js/market.js"></script>
<script src="../js/engine.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/fieldmap.js"></script>
<script>
const $ = id => document.getElementById(id);
const E = Engine, G = GAME_DATA;

const ORES = ['coal', 'ironore', 'copperore', 'silica'];
// 枠が無制限（無尽蔵の鉱床）でもアイコンが長くなりすぎないように
const slotTxt = n => n === Infinity ? '無制限' : n;
const ic = (n, ch) => n <= 24 ? ch.repeat(n) : ch.repeat(24) + '…×' + n;
const ghosts = (free, ch) => ch.repeat(Math.max(0, Math.min(8, free)));
function renderMines(s) {
  const lock = E.buildLockReason(s, 'mine');
  const out = [`<div class="card"><div class="sub">鉱区を買って鉱山を建てると、鉱石が貯鉱場に入り、工場がまず使います（買う量が減る）。鉱石は売れません。貯鉱場は鉱石ごとに建てます。鉱山は年${Math.round(G.buildings.mine.declinePerYear * 100)}%ずつ減ります。<b>貯鉱場が無い・満杯だと鉱山は止まります（休止もできます）。</b>${lock ? `<br><span class="bad">${lock}</span>` : ''}</div></div>`];
  for (const res of ORES) {
    const R = G.resources[res], o = G.buildings.mine.ores[res], rate = E.mineRateOf(s, res);
    const stock = s.inventory[res] || 0, yc = E.yardCap(s, res), yn = E.yardCount(s, res), yb = E.yardBuilding(s, res), room = E.oreRoom(s, res), full = rate > 0 && room < rate;
    const ychk = E.canBuildYard(s, res), YC = G.buildings.mine.yard;
    const sites = Object.keys(G.mineSites).filter(id => G.mineSites[id].res === res && (!G.mineSites[id].endless || E.endlessOpen(s) || E.mineSiteState(s, id).owned));
    const IMG = { coal: 'coal', ironore: 'iron', copperore: 'copper', silica: 'silica' }[res];
    const cards = sites.map(id => {
      const S = G.mineSites[id], st = E.mineSiteState(s, id), n = E.minesOnSite(s, id), nb = E.buildingOnSite(s, id);
      const rich = st.revealed ? `豊かさ <b>${S.richness.toFixed(2)}</b>` : `推定 ${S.estimate[0]}〜${S.estimate[1]}`;
      let body;
      if (st.owned) {
        const chk = E.canBuildMine(s, id);
        const paused = !!E.mineSiteState(s, id).paused;
        body = `<img class="pic" src="../assets/bl/mine_${IMG}_r0.png" alt="">
          <div class="icons">${ic(n, '⛏️')}${ic(nb, '🚧')}<span class="ghost">${ghosts(S.slots - n - nb, '◻️')}</span></div>
          <div class="sub">鉱山 ${n}/${slotTxt(S.slots)}${S.endless ? '　<b class="good">枯れない</b>' : ''}${paused ? '　<b class="bad">休止中</b>' : ''}　日量 ${E.fmtNum(E.mineRateOn(s, id))}t${st.revealed ? `　新規は日量約${E.fmtNum(o.rate * S.richness)}t` : ''}</div>
          <div class="btns" style="margin-top:6px">${n > 0 ? `<button class="btn sec small" onclick="UI.act(s=>Engine.toggleMineSite(s,'${id}'))">${paused ? '▶ 再開する' : '⏸ 休止する'}</button> ` : ''}<button class="btn small" ${chk.ok ? '' : 'disabled'} onclick="UI.act(s=>Engine.buildMine(s,'${id}'))">鉱山を建てる（${E.fmtMoney(E.mineCost(s, id))}・${E.buildText(G.buildings.mine.months)}）</button></div>`;
      } else {
        const lc = Math.round(S.cost * E.priceIndex(s)), ok = !lock && s.cash >= lc;
        body = `<div class="sub">${S.desc}　枠 ${slotTxt(S.slots)}${S.endless ? '' : 'か所'}</div>
          <div class="btns" style="margin-top:6px"><button class="btn sec small" ${ok ? '' : 'disabled'} onclick="UI.act(s=>Engine.buyMineSite(s,'${id}'))">採掘権を買う（${E.fmtMoney(lc)}）</button></div>`;
      }
      return `<div class="card"><div class="row"><h3>${S.name}${st.owned ? '' : ' <span class="sub">未取得</span>'}</h3><span class="sub">${rich}</span></div>${body}</div>`;
    }).join('');
    out.push(`<h2>${R.name}</h2><div class="card"><div class="grid2 num"><div>日量 <b>${E.fmtNum(rate)}</b> t</div><div>在庫 <b>${E.fmtNum(stock)}</b> / ${E.fmtNum(yc)}</div></div>
      <img class="pic" src="../assets/bl/yard_${IMG}_r0.png" alt="">
      <div class="icons">${'🗄️'.repeat(yn)}${'🚧'.repeat(yb)}<span class="ghost">${'◻️'.repeat(Math.max(0, YC.max - yn - yb))}</span></div>
      <div class="sub">貯鉱場 ${yn}棟（1棟 ${E.fmtNum(YC.cap[res])}t）　｜　操業費 ${E.fmtMoney(o.opexPerUnit * E.priceIndex(s))}/t<br>${yn + yb === 0 ? '<span class="bad">貯鉱場が無いと、鉱山は掘れない</span>' : full ? '<span class="bad">貯鉱場が満杯のため、鉱山は止まっている（在庫を使うと再開。買った鉱石も在庫に入る）</span>' : `あと ${E.fmtNum(room)}t まで入る`}</div>
      <div class="btns" style="margin-top:6px"><button class="btn sec small" ${ychk.ok ? '' : 'disabled'} onclick="UI.act(s=>Engine.buildYard(s,'${res}'))">貯鉱場を建てる（${E.fmtMoney(E.yardCost(s))}・${E.buildText(YC.months)}）</button></div></div>${cards}`);
  }
  UI.html('mineview', out.join(''));
}

// 地図で選んだ区画の操作（カードと同じ操作）
function renderMapInfo(s) {
  const z = FieldMap.selected();
  if (!z) { UI.html('mapinfo', '<div class="card"><div class="sub">区画をタップすると、ここで操作できます。</div></div>'); return; }
  const btn = (ok, act, txt, cls) => `<button class="btn ${cls || ''} small" ${ok ? '' : 'disabled'} onclick="UI.act(s=>${act})">${txt}</button> `;
  let body = '';
  if (z.kind === 'oil') {
    const L = G.leases[z.id], st = s.leases[z.id], n = E.wellsOnLease(s, z.id), nb = E.buildingOnLease(s, z.id);
    if (st.owned) { const chk = E.canBuild(s, 'oilWell', z.id); body = `<div class="sub">油井 ${n}/${L.slots}本　日量 ${E.fmtNum(s.wells.filter(w => w.lease === z.id).reduce((a, w) => a + E.wellRate(s, w), 0))}bbl${st.revealed ? `　豊かさ ${L.richness.toFixed(2)}` : `　推定 ${L.estimate[0]}〜${L.estimate[1]}`}</div>` + btn(chk.ok, `Engine.build(s,'oilWell','${z.id}')`, `油井を掘る（${E.fmtMoney(E.costOf(s, 'oilWell', z.id))}）`); }
    else { const lc = Math.round(L.cost * E.priceIndex(s)); body = `<div class="sub">${L.desc}　枠 ${L.slots}本</div>` + btn(s.cash >= lc, `Engine.buyLease(s,'${z.id}')`, `採掘権を買う（${E.fmtMoney(lc)}）`, 'sec'); }
  } else if (z.kind === 'mine') {
    const S = G.mineSites[z.id], st = E.mineSiteState(s, z.id), n = E.minesOnSite(s, z.id);
    if (st.owned) { const chk = E.canBuildMine(s, z.id); body = `<div class="sub">${G.resources[S.res].name}の鉱山 ${n}/${S.slots}　日量 ${E.fmtNum(E.mineRateOn(s, z.id))}t${st.paused ? '　<b class="bad">休止中</b>' : ''}${st.revealed ? `　豊かさ ${S.richness.toFixed(2)}` : `　推定 ${S.estimate[0]}〜${S.estimate[1]}`}</div>` + (n ? btn(true, `Engine.toggleMineSite(s,'${z.id}')`, st.paused ? '▶ 再開する' : '⏸ 休止する', 'sec') : '') + btn(chk.ok, `Engine.buildMine(s,'${z.id}')`, `鉱山を建てる（${E.fmtMoney(E.mineCost(s, z.id))}）`); if (!chk.ok && chk.msg) body += `<div class="sub">${chk.msg}</div>`; }
    else { const lc = Math.round(S.cost * E.priceIndex(s)), lock = E.buildLockReason(s, 'mine'); body = `<div class="sub">${S.desc}　枠 ${S.slots}か所</div>` + btn(!lock && s.cash >= lc, `Engine.buyMineSite(s,'${z.id}')`, `採掘権を買う（${E.fmtMoney(lc)}）`, 'sec'); if (lock) body += `<div class="sub bad">${lock}</div>`; }
  } else if (z.kind === 'yard') {
    const chk = E.canBuildYard(s, z.res), yc = E.yardCap(s, z.res);
    body = `<div class="sub">在庫 ${E.fmtNum(s.inventory[z.res] || 0)} / ${E.fmtNum(yc)}t　貯鉱場 ${E.yardCount(s, z.res)}棟</div>` + btn(chk.ok, `Engine.buildYard(s,'${z.res}')`, `貯鉱場を建てる（${E.fmtMoney(E.yardCost(s))}）`);
    if (!chk.ok && chk.msg) body += `<div class="sub">${chk.msg}</div>`;
  } else {
    const chk = E.canBuild(s, 'crudeTank');
    body = `<div class="sub">原油 ${E.fmtNum(s.inventory.crude)} / ${E.fmtNum(E.capacity(s, 'crude'))}bbl　タンク ${E.count(s, 'crudeTank')}基</div>` + btn(chk.ok, `Engine.build(s,'crudeTank')`, `原油タンクを建てる（${E.fmtMoney(E.costOf(s, 'crudeTank'))}）`);
  }
  UI.html('mapinfo', `<div class="card"><div class="row"><h3>${z.label}</h3></div>${body}</div>`);
}

function render(s) {
  const tab = UI.tab('field-tab', 'oil');
  UI.html('ftabs', UI.chips('field-tab', [{ id: 'oil', label: '🛢️ 石油' }, { id: 'mine', label: '⛏️ 鉱山' }, { id: 'map', label: '🗺 地図' }], tab));
  $('oilview').style.display = tab === 'oil' ? '' : 'none';
  $('mineview').style.display = tab === 'mine' ? '' : 'none';
  $('mapview').style.display = tab === 'map' ? '' : 'none';
  if (tab === 'mine') renderMines(s);
  if (tab === 'map') { FieldMap.update(s); renderMapInfo(s); }
  const rate = E.totalWellRate(s);
  $('wellcount').textContent = `油井 ${s.wells.length}本`;
  $('rate').textContent = E.fmtNum(rate);
  const cap = E.capacity(s, 'crude');
  $('crude').textContent = `${E.fmtNum(s.inventory.crude)} / ${E.fmtNum(cap)}`;
  const ratio = cap ? s.inventory.crude / cap : 1;
  $('crudebar').firstElementChild.style.width = (ratio * 100) + '%';
  $('crudebar').classList.toggle('full', ratio > 0.97);
  const net = rate - E.refineryThroughput(s) * s.refinery.runRate;
  const daysToFull = net > 0 ? (cap - s.inventory.crude) / net : Infinity;
  const ship = E.daysToShipment(s);
  UI.html('tankicons', '⚫'.repeat(E.count(s, 'crudeTank')) + '🚧'.repeat(E.constructing(s, 'crudeTank')));
  UI.html('crudeinfo', ratio > 0.97
    ? '<span class="bad">満杯で油井が止まっている！タンクを増やすか港を改修する</span>'
    : `次の出荷まで${ship}日　｜　${daysToFull === Infinity ? '満杯にはならない' : `あと約${Math.floor(daysToFull)}日で満杯${daysToFull < ship ? '<span class="bad">（出荷日に間に合わない）</span>' : ''}`}`);
  const tk = E.canBuild(s, 'crudeTank');
  $('b-tank').textContent = `原油タンク +${E.fmtNum(G.buildings.crudeTank.capacity.crude)}bbl（${E.fmtMoney(E.costOf(s, 'crudeTank'))}・${E.buildText(G.buildings.crudeTank.months)}）`;
  $('b-tank').disabled = !tk.ok;

  // 鉱区
  const html = [];
  for (const id in G.leases) {
    const L = G.leases[id], st = s.leases[id];
    const n = E.wellsOnLease(s, id), nb = E.buildingOnLease(s, id);
    const rich = st.revealed ? `豊かさ <b>${L.richness.toFixed(2)}</b>` : `推定 ${L.estimate[0]}〜${L.estimate[1]}`;
    const wellCost = E.costOf(s, 'oilWell', id);
    const newRate = G.buildings.oilWell.initialRate * L.richness;
    let body;
    if (st.owned) {
      const icons = '🛢️'.repeat(n) + '🚧'.repeat(nb) + `<span class="ghost">${'◻️'.repeat(Math.max(0, L.slots - n - nb))}</span>`;
      const leaseRate = s.wells.filter(w => w.lease === id).reduce((a, w) => a + E.wellRate(s, w), 0);
      const chk = E.canBuild(s, 'oilWell', id);
      body = `<img class="pic" src="../assets/bl/oilWell_r0.png" alt="">
        <div class="icons">${icons}</div>
        <div class="sub">油井 ${n}/${L.slots}本　日量 ${E.fmtNum(leaseRate)}bbl${st.revealed ? `　新規井は日量約${Math.round(newRate)}bbl` : ''}</div>
        <div class="btns" style="margin-top:6px"><button class="btn small" ${chk.ok ? '' : 'disabled'} onclick="UI.act(s=>Engine.build(s,'oilWell','${id}'))">油井を掘る（${E.fmtMoney(wellCost)}・${E.buildText(G.buildings.oilWell.months)}）</button></div>`;
    } else {
      const lc = Math.round(L.cost * E.priceIndex(s));
      body = `<div class="sub">${L.desc}　枠 ${L.slots}本　掘削費 ×${L.wellCostMul}</div>
        <div class="btns" style="margin-top:6px"><button class="btn sec small" ${s.cash >= lc ? '' : 'disabled'} onclick="UI.act(s=>Engine.buyLease(s,'${id}'))">採掘権を買う（${E.fmtMoney(lc)}）</button></div>`;
    }
    html.push(`<div class="card"><div class="row"><h3>${L.name}${st.owned ? '' : ' <span class="sub">未取得</span>'}</h3><span class="sub">${rich}</span></div>${body}</div>`);
  }
  { // 無尽蔵の油田（終盤。Tier 6 のノードを開くと買える。枠は無制限・日量は減らない）
    const id = 'endless', L = E.leaseDef(id), st = s.leases[id] || { owned: false, revealed: true };
    if (E.endlessOpen(s) || st.owned) {
      const n = E.wellsOnLease(s, id), nb = E.buildingOnLease(s, id), wellCost = E.costOf(s, 'oilWell', id);
      let body;
      if (st.owned) {
        const leaseRate = s.wells.filter(w => w.lease === id).reduce((a, w) => a + E.wellRate(s, w), 0), chk = E.canBuild(s, 'oilWell', id);
        body = `<img class="pic" src="../assets/bl/oilWell_r0.png" alt=""><div class="icons">${ic(n, '🛢️')}${ic(nb, '🚧')}<span class="ghost">${ghosts(8, '◻️')}</span></div>
          <div class="sub">油井 ${n}本（無制限・<b class="good">枯れない</b>）　日量 ${E.fmtNum(leaseRate)}bbl　新規井は日量約${Math.round(G.buildings.oilWell.initialRate * L.richness)}bbl</div>
          <div class="btns" style="margin-top:6px"><button class="btn small" ${chk.ok ? '' : 'disabled'} onclick="UI.act(s=>Engine.build(s,'oilWell','${id}'))">油井を掘る（${E.fmtMoney(wellCost)}・${E.buildText(G.buildings.oilWell.months)}）</button></div>`;
      } else {
        const lc = Math.round(L.cost * E.priceIndex(s));
        body = `<div class="sub">${L.desc}　枠 無制限　掘削費 ×${L.wellCostMul}</div><div class="btns" style="margin-top:6px"><button class="btn sec small" ${s.cash >= lc ? '' : 'disabled'} onclick="UI.act(s=>Engine.buyLease(s,'${id}'))">採掘権を買う（${E.fmtMoney(lc)}）</button></div>`;
      }
      html.push(`<div class="card"><div class="row"><h3>${L.name}${st.owned ? '' : ' <span class="sub">未取得</span>'}</h3><span class="sub">豊かさ <b>${L.richness.toFixed(2)}</b></span></div>${body}</div>`);
    }
  }
  UI.html('leases', html.join(''));

  UI.html('log', s.log.slice(0, 30).map(l => `<div><span class="sub">${E.year({ day: l.day })}/${E.monthNum({ day: l.day })}</span> ${l.text}</div>`).join(''));
}
FieldMap.init($('fmap'), () => UI.refresh());
UI.boot({ page: 'field', render });
</script>
</body>
</html>
